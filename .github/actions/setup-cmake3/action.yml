name: 'Set up CMake 3'
description: >
  Install the CMake that toffy is actually built with. Not a workaround with a
  expiry date: toffy ships on embedded systems whose toolchains provide CMake 3
  and nothing else, so CMake 3 is the supported contract, and a pipeline running
  on anything else is measuring something nobody deploys.

# ---------------------------------------------------------------------------
# Why the pipeline pins CMake 3, and what would have to change for that to end
# ---------------------------------------------------------------------------
# The deployment target decides. toffy is built into embedded systems that ship
# a CMake 3 toolchain, so CMake 3 is the contract. "Does it configure on the
# newest CMake" is not a question this project is obliged to answer, and
# answering it by opting into CMake 4 behaviour would be answering a question
# nobody asked — at the cost of the configuration that actually ships.
#
# What this repository was doing before is the cautionary tale, and it is why
# the pin is written up here rather than left as a one-line step. CI ran
# `ubuntu-latest` with the image's own CMake. On 2026-10-03 that image moved to
# CMake 4, which removed the FindBoost module (policy CMP0167), and every job
# that configures toffy went red at `find_package(Boost … REQUIRED)`. It stayed
# red for 15 consecutive runs across two releases — docs-only commits included —
# because no commit in the repository had changed and no local build could
# reproduce it. An environment that moves under the pipeline cannot be cited as
# evidence, and this project had just spent three weeks citing it.
#
# The companion change is in CMakeLists.txt: under CMake 3 the policy is set OLD
# and `Boost_NO_BOOST_CMAKE` is ON, so Boost is found the way a sysroot provides
# it — headers and libraries, no CMake package files. Setting CMP0167 to NEW
# instead, which an earlier commit here did, forces config mode and lands on the
# image's Boost 1.90, whose BoostConfig.cmake asks for per-component package
# files the image does not ship. Same failure, one level down: that is why
# "just support CMake 4" was never the fix, and why a CMake 4 build now gets one
# explicit sentence instead of a Boost internals stack trace.
#
# So the deletion condition is *not* "when CMake 4 works". It is: when the
# deployment targets move to CMake 4, change this version, the policy block in
# CMakeLists.txt and the documented contract in one commit — and re-verify every
# consumer in the chain, because a toolchain change here is a toolchain change
# for toffy-oatpp and boxes as well.
#
# Measured 2026-10-28, on cmake 3.31.6 and 3.28.3 against the same Boost: with
# CMP0167 NEW, Boost resolves through
# /usr/lib/aarch64-linux-gnu/cmake/Boost-1.83.0/BoostConfig.cmake (config mode —
# packaging-dependent); with the policy OLD and Boost_NO_BOOST_CMAKE ON it
# resolves through FindBoost to /usr/include (module mode — packaging-
# independent). Both configure and build clean here, which is exactly why the
# difference was invisible until it was a red pipeline.

inputs:
  version:
    description: 'CMake 3.x version to install'
    default: '3.31.6'
    required: false

runs:
  using: composite
  steps:
    - name: Install CMake ${{ inputs.version }}
      shell: bash
      run: |
        set -euxo pipefail
        ver="${{ inputs.version }}"
        case "$ver" in
          3.*) : ;;
          *) echo "::error::toffy's contract is CMake 3 (embedded toolchains); got '$ver'. If the deployment targets have moved, change the contract in CMakeLists.txt too — do not just bump this." ; exit 1 ;;
        esac
        # Official Kitware build: no PPA, no pip (Ubuntu 26 marks the system
        # Python externally managed, and a --break-system-packages in CI is its
        # own future incident), no auth. Public release asset, ~50 MB.
        url="https://github.com/Kitware/CMake/releases/download/v${ver}/cmake-${ver}-linux-$(uname -m).tar.gz"
        dest="${RUNNER_TEMP:-/tmp}/cmake-${ver}"
        mkdir -p "$dest"
        curl -fsSL "$url" | tar -xz --strip-components=1 -C "$dest"
        echo "$dest/bin" >> "$GITHUB_PATH"
    - name: Verify the pin actually took
      # Not decoration. If PATH ordering ever stops working, this action becomes
      # a silent no-op and every job goes back to the CMake 4 failure with a
      # commit that says "pinned cmake". Check the claim, in the job, every run.
      shell: bash
      run: |
        set -euo pipefail
        v="$(cmake --version | head -1)"
        echo "cmake: $v  ($(command -v cmake))"
        case "$v" in
          "cmake version 3."*) : ;;
          *) echo "::error::cmake is not 3.x despite the pin: $v"; exit 1 ;;
        esac

name: CI

# Builds and runs the ctest suite. This is the gate the project never had:
# .github/ previously held only Codacy, Flawfinder and Dependabot, i.e. static
# analysis bots and a dependency updater, so nothing ever compiled or tested a
# change and "CI green" could not be cited as evidence (DOD 1.2).
#
# Triggers on pushes to any branch, not just main, because the cleanup work
# happens on feature branches and a gate that only runs after merge is not a
# gate. Concurrency cancels superseded runs so this stays cheap.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # Both configurations must be reported. With fail-fast the second cell
      # would be cancelled when the first fails, and the two fail for unrelated
      # reasons -- PCL-dependent code and PCL-independent code.
      fail-fast: false
      matrix:
        include:
          # The bta library is proprietary Becom SDK and cannot exist on a
          # runner, so every CI configuration is BTA-off. That axis is covered
          # here by construction; a BTA-on build can only be checked on a
          # developer machine that has the SDK.
          - label: "PCL on,  BTA off"
            without_pcl: "OFF"
          - label: "PCL off, BTA off"
            without_pcl: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          # libboost-all-dev rather than the individual component packages: the
          # build needs log, log_setup, program_options, system, filesystem,
          # date_time, serialization, chrono and thread, plus the header-only
          # container headers. The umbrella package is the reliable option; it
          # can be trimmed later if install time matters.
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            pkg-config \
            libboost-all-dev \
            libopencv-dev \
            libgtest-dev \
            libpcl-dev

      - name: Report toolchain
        run: |
          cmake --version | head -1
          g++ --version | head -1
          pkg-config --modversion opencv4 || true

      - name: Configure
        run: |
          set -euxo pipefail
          # No BUILD_DOC flag: it is referenced nowhere in the build and does
          # nothing. docs/CMakeLists.txt is include()'d unconditionally and its
          # target only ever runs on demand, so CI simply never builds it.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITHOUT_PCL=${{ matrix.without_pcl }}

      - name: Build
        # tee'd so the warning report step below can see what the compiler said.
        # pipefail is load-bearing: without it the exit status of the pipeline is
        # tee's and a failed build would sail through to the Test step.
        run: |
          set -eo pipefail
          cmake --build build -j "$(nproc)" 2>&1 | tee build.log

      - name: Warning report (P3-11)
        # Prints the warning count per area and fails only on modules/core, which
        # is compiled -Werror since P3-4. The rest of the tree is reported, not
        # gated - see tools/warning_report.sh for why.
        run: tools/warning_report.sh build.log

      - name: Test
        # --output-on-failure so a red run is diagnosable from the log alone,
        # without re-running anything.
        run: ctest --test-dir build --output-on-failure

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-${{ matrix.label }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
            build/Testing/Temporary/LastTest.log
            build.log
          if-no-files-found: ignore

  sanitizers:
    name: build & test (ASan + UBSan)
    runs-on: ubuntu-latest
    # A green ctest is weak evidence for a memory error; the sanitizers are the
    # stage gate DOD 2 puts on the threading and ownership work (P2-7, P2-5).
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libboost-all-dev libopencv-dev libgtest-dev libpcl-dev

      - name: Configure
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: build & test (ThreadSanitizer)
    runs-on: ubuntu-latest
    # P2-7. The job above cannot answer a question about data races: AddressSanitizer
    # and ThreadSanitizer cannot be built together, and every defect the threading
    # work fixed is invisible to ASan -- the plain-bool run flag, the wait on a mutex
    # no other thread held, the queue read outside its lock. This is the job that
    # answers it, and it is the one cleanup/order.md asked for when it said "a green
    # ctest is weak evidence for a data race; a green TSan run is not".
    #
    # Verified capable of failing: on the pre-P2-7 tree this reports, with the
    # suppressions file in place,
    #
    #   data race  modules/core/src/filterThread.cpp:58 in toffy::FilterThread::stop()
    #   data race  modules/core/src/filterThread.cpp:96 in toffy::FilterThread::loop()
    #
    # which is the `bool keepRunning` written by one thread and read by another,
    # found by running this job against the parent commit.
    #
    # Two things that are not obvious from the steps:
    #   - `setarch -R` is load-bearing. TSan reserves a large shadow map and refuses
    #     to start at all -- "FATAL: ThreadSanitizer: unexpected memory mapping" --
    #     when the kernel places the binary outside it, so ASLR has to be off for
    #     the run. Without it every test dies at exec and the job is green on an
    #     empty log.
    #   - tools/tsan_suppressions.txt silences exactly one third-party module
    #     (libOpenNI2, pulled in by PCL's I/O, which unlocks a mutex from a thread
    #     other than its owner at shutdown). It is scoped by module, so a toffy
    #     mutex misused the same way is still reported in toffy frames.
    #
    # Scope: PCL on, BTA off, like every other job -- the bta SDK is proprietary and
    # cannot exist on a runner, so modules/bta's threading (std::mutex and a
    # std::condition_variable in BtaWrapper) is not covered here. See A29 for what
    # that leaves open.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          # util-linux for setarch; it is in the base image, and named anyway
          # because the job does not run without it.
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config util-linux \
            libboost-all-dev libopencv-dev libgtest-dev libpcl-dev

      - name: Configure
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test, and fail on any race TSan reports
        # Both halves matter: a red ctest is a failure, and so is a race in a test
        # that went on to pass (TSan reports to stderr and does not fail the
        # process by default, so a plain `ctest` here would be green on a log full
        # of races -- the same trap the docs job hit with doxygen's exit code).
        run: |
          set -uo pipefail
          log=$(mktemp)
          TSAN_OPTIONS="halt_on_error=0:suppressions=$PWD/tools/tsan_suppressions.txt" \
            setarch "$(uname -m)" -R \
            ctest --test-dir build --output-on-failure 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          hits=$(grep -E 'WARNING: ThreadSanitizer' "$log" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '::error::ThreadSanitizer reported a data race. See cleanup/findings/correctness.md ("D") and tests/test_filterthread.cpp for what the threading contract is.'
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::ctest failed under ThreadSanitizer (exit $rc)"
            exit "$rc"
          fi
          echo "no ThreadSanitizer reports; ctest exit 0"

  installed-headers:
    name: installed headers compile standalone
    runs-on: ubuntu-latest
    # P3-12 / finding N1. `make install` ships every file under every */include/ directory,
    # and nothing in the build ever included most of them: a header whose only consumer was
    # deleted keeps shipping, keeps rotting, and stays invisible because the library still
    # builds. Four toffy/web/ headers got that far - one of them includes a file that does not
    # exist, so no user could ever have included it - and two in libraries/graphs/ compiled
    # only when some earlier include happened to pull OpenCV in first.
    #
    # The check compiles each installed header as the *only* include of a translation unit,
    # which is what a downstream user does. See tools/installed_header_check.sh for the
    # failure classification (a missing third-party header is a skip, a missing toffy header
    # is a finding) and for why a run that tests nothing exits 2.
    #
    # Scope, stated per DOD 0 rule 9: the *installed* tree, so it does not matter which of
    # the four install(DIRECTORY include/) rules put a header there. Two caveats: the runner
    # has no proprietary bta SDK, so modules/bta's tree is not installed and not tested here;
    # and a header whose third-party dependency is absent is reported as skipped rather than
    # as a pass.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            pkg-config \
            libboost-all-dev \
            libopencv-dev \
            libpcl-dev

      - name: Configure
        # Tests off: nothing under tests/ is installed, and Release because that is the
        # configuration the counters are quoted against.
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      - name: Build the library
        # install() ships libtoffy.so, so `cmake --install` fails without it; the apps and
        # the tests are not installed, so building only this target is the cheapest tree
        # that can be staged. The headers themselves are generated at configure time.
        run: cmake --build build -j "$(nproc)" --target toffy

      - name: Stage the install tree
        run: |
          set -euxo pipefail
          cmake --install build --prefix "$PWD/stage"
          echo "staged $(find stage/include \( -name '*.hpp' -o -name '*.h' \) | wc -l) headers"

      - name: Compile every installed header standalone and twice
        run: |
          set -euo pipefail
          # pkg-config rather than hardcoded paths: the PCL include directory carries its
          # version (/usr/include/pcl-1.14 today) and that is not ours to track.
          tools/installed_header_check.sh "$PWD/stage/include" \
            $(pkg-config --cflags opencv4 pcl_common)

      - name: No controller residue in the source tree
        # The compile check above can only reach what the runner can build, and the runner
        # has no proprietary bta SDK: modules/bta is never configured here, so its 7
        # installed headers are never staged and never compiled. Two of the four deleted
        # toffy/web/ headers lived in exactly that tree, and so did every WITH_CONTROL site
        # - this is the half of the gate the compile check is structurally blind to.
        #
        # Scope, stated per DOD 0 rule 9: compiled code and build files only (*.cpp/*.hpp/
        # *.h/*.in/*CMakeLists.txt/*.cmake). Prose is out of scope deliberately - the cleanup
        # docs, this job's own comment, tools/installed_header_check.sh's classification
        # table and use.dox's "where did the web interface go" section all name these strings
        # in order to record that they are gone, and a gate that fires on every sentence
        # describing the removal is a gate that gets deleted. *.dox is prose: it is out for
        # the same reason *.md is, and nothing is lost, because a WITH_CONTROL hook or a
        # toffy_web/ include can only ever take effect in something the compiler reads.
        # (This job listed *.dox until the X4 page tripped it - the gate was wrong, not the
        # page.)
        #
        # Verified to be capable of failing: re-adding one #ifdef WITH_CONTROL line to
        # modules/bta/src/initPlugin.cpp turns this step red, removing it turns it green.
        run: |
          set -uo pipefail
          hits=$(git ls-files -z '*.cpp' '*.hpp' '*.h' '*.in' '*.txt' '*.cmake' \
                   | xargs -0 -r grep -nHE 'toffy_web/|toffy/web/|WITH_CONTROL' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '::error::the web control layer lives in toffy-oatpp, not here.' \
              'Do not reintroduce toffy/web/ headers or WITH_CONTROL hooks.' \
              'See cleanup/plan/controller-extraction.md.'
            exit 1
          fi
          echo 'no controller residue in the tracked code and build files'

  docs:
    name: doxygen docs build warning-free
    runs-on: ubuntu-latest
    # X4 follow-up, counter 30. `cmake --build build --target docs` exited 0 while emitting
    # 15 diagnostics - 14 obsolete Doxyfile tags, an EXAMPLE_PATH entry that has pointed at
    # a non-existent directory since 59b6bcf, and an HTML_EXTRA_FILES entry for a file git
    # has never contained. An exit code that cannot go red is not a gate, so this job reads
    # the log instead. The tree is warning-free as of this commit, so the gate can hold.
    #
    # Scope, stated per DOD 0 rule 9: the Doxygen run only - no library build, and the
    # generated HTML is not published anywhere. PCL and the bta SDK are deliberately absent:
    # measured on a -DWITHOUT_PCL=ON / no-bta configuration, the docs target emits the same
    # 22 pages with 0 warnings as the full configuration, so the heavy dependencies buy
    # nothing here. graphviz is installed because FindDoxygen's `dot` component changes what
    # gets generated, and this job is meant to match what a developer sees.
    #
    # Verified to be capable of failing: re-adding `PERL_PATH = /usr/bin/perl` to
    # docs/Doxyfile.cfg turns the step red on the obsolete-tag warning; removing it again
    # turns it green.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            pkg-config \
            libboost-all-dev \
            libopencv-dev \
            doxygen \
            graphviz

      - name: Configure
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      - name: Build the docs and fail on any warning
        # A fresh build dir means doxygen always runs; in a developer's tree an up-to-date
        # `docs` target re-runs nothing, prints nothing and would pass for the wrong reason.
        run: |
          set -uo pipefail
          log=$(mktemp)
          cmake --build build --target docs 2>&1 | tee "$log"
          hits=$(grep -E 'warning:|error:' "$log" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '::error::the Doxygen build is not warning-free. See cleanup/findings/documentation.md and counter 30 in cleanup/counters.md.'
            exit 1
          fi
          echo "docs generated warning-free: $(find build/public/html -name '*.html' | wc -l) pages"

  cmake-hygiene:
    name: hygiene (cmake style, platform branches, no shell)
    runs-on: ubuntu-latest
    # P3-7 / finding N6. This bug class is what hid the PCL-less build for as long
    # as it took: if() takes variable *names*, so an empty variable makes
    #   if( ${V} )          silently false, and
    #   if( ${V} AND X )    a hard "Unknown arguments specified" configure error.
    # Both were measured on cmake 3.28 (see cleanup/findings/build.md).
    #
    # Scope, stated per DOD 0 rule 9: the 29 *tracked* CMakeLists.txt and *.cmake
    # files (git ls-files, so generated files in a build tree cannot produce a false
    # positive - toffyConfig.cmake in build/generated/ does contain if(${...}) and is
    # not ours to fix). MATCHES/STREQUAL comparisons are excluded because expanding
    # the left operand first is the idiom there and is correct as written.
    #
    # Verified to be capable of failing: re-introducing one site locally turns this
    # step red, and removing it turns it green again.
    steps:
      - uses: actions/checkout@v4

      - name: No if( ${VAR} ) sites
        run: |
          set -uo pipefail
          hits=$(git ls-files -z '*.cmake' '*CMakeLists.txt' \
                   | xargs -0 -r grep -HE '(if|elseif|while)[[:space:]]*\([[:space:]]*\$\{' \
                   | grep -vE 'MATCHES|STREQUAL' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '::error::if( ${VAR} ) expands before if() evaluates it. Write if(VAR).' \
              'See cleanup/plan/second-pass.md P3-7 and cleanup/findings/build.md N6.'
            exit 1
          fi
          echo 'no if( ${VAR} ) sites in the tracked CMake files'

      - name: No MSVC branches in the sources (P2-2)
        # toffy is POSIX-only. The 15 `#ifdef MSVC` branches this step replaced were never
        # compiled in the library - only apps/ consumed the definition of MSVC, so the
        # dlfcn() half was what every platform built, Windows included, and a Windows build
        # therefore could not compile libtoffy at all. The platform policy at the top of
        # CMakeLists.txt now refuses a Windows configure; this step stops the branches
        # creeping back one at a time, which is how they were written in the first place.
        # See cleanup/plan/build-and-hygiene.md P2-2 and cleanup/findings/build.md.
        #
        # The pattern covers #if / #ifdef / #ifndef / #elif and both spellings of the
        # macro (MSVC, and _MSC_VER, which the tree never used and which a new branch is
        # more likely to reach for than the project-local name).
        #
        # Scope, stated per DOD 0 rule 9: tracked compiled code (*.cpp/*.hpp/*.h) for the
        # preprocessor directive, and the tracked CMake files for the definition. Two
        # deliberate exclusions, both stated rather than discovered by accident:
        #   - prose (*.md, *.dox) names MSVC in order to record that it is gone;
        #   - apps/tst_pb.cpp guards on PLAT_WINDOWS/WIN32 and includes <windows.h> behind
        #     one of those. It is a vendored Becom BTA SDK example whose platform branches
        #     are the vendor's, PLAT_LINUX is genuinely defined by this build, and CI cannot
        #     compile it at all (no SDK). Counted separately in counters.md counter 14b.
        run: |
          set -uo pipefail
          hits=$(git ls-files -z '*.cpp' '*.hpp' '*.h' \
                   | xargs -0 -r grep -nHE '^[[:space:]]*#[[:space:]]*(if|ifdef|ifndef|elif)[[:space:]].*(MSVC|_MSC_VER)' || true)
          defs=$(git ls-files -z '*CMakeLists.txt' '*.cmake' \
                   | xargs -0 -r grep -nHE -e '-DMSVC' || true)
          if [ -n "$hits" ] || [ -n "$defs" ]; then
            [ -n "$hits" ] && echo "$hits"
            [ -n "$defs" ] && echo "$defs"
            echo "::error::toffy is POSIX-only. Do not add MSVC branches or define MSVC: the plug-in loader is dlfcn(), and a Windows port needs a platform abstraction around it first. See cleanup/plan/build-and-hygiene.md (P2-2)."
            exit 1
          fi
          echo 'no MSVC branches in the tracked sources and no MSVC definition in the build'

      - name: No shell in the pipeline (P3-5)
        # ObjectTrack used to concatenate options/script — a value read straight out of an XML
        # config file — with two numbers and a trailing '&', and hand the result to /bin/sh, so
        # any shell metacharacter in a config file ran with this process's privileges. It runs
        # execvp() on an argv array now; this step stops the shell creeping back as the short
        # way to "just run a helper script". See cleanup/findings/security.md N4.
        #
        # Scope, stated per DOD 0 rule 9: tracked compiled code (*.cpp/*.hpp/*.h) across the
        # whole tree, because the claim being gated is "no system() anywhere", not "none in
        # modules/filters" — the counter's original scope. Comments are stripped: runDetached()'s
        # doc comment names system() in order to record what it replaced, and a gate that fires
        # on the sentence describing the fix is a gate that gets deleted (the same lesson X4
        # learned about *.dox, and counter 20 in counters.md strips comments for the same reason).
        #
        # Verified to be capable of failing: re-adding `  system("true");` to
        # modules/filters/src/detection/objectTrack.cpp turns this step red on exactly one line;
        # removing it turns it green again.
        run: |
          set -uo pipefail
          hits=$(git ls-files -z '*.cpp' '*.hpp' '*.h' \
                   | xargs -0 -r grep -nHE '\bsystem[[:space:]]*\(' \
                   | grep -vE ':[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::do not hand configuration data to a shell. Use posix_spawn or fork+execvp with an argv array. See cleanup/findings/security.md N4 and cleanup/plan/second-pass.md P3-5."
            exit 1
          fi
          echo 'no system() call in the tracked sources'

      - name: No Boost threading primitives in the sources (P2-7)
        # The threading is the standard library's: std::thread, std::mutex,
        # std::condition_variable, std::atomic<bool>. It used to be boost::thread in
        # four classes -- two of them (FilterThread, Controller) in *installed*
        # headers, so a consumer of libtoffy inherited both <boost/thread.hpp> and
        # the Boost.Thread link dependency -- plus boost::mutex/condition_variable in
        # BtaWrapper and boost::interprocess::interprocess_semaphore in FilterBank.
        #
        # Why this is worth a gate and not just a grep in a commit message: Boost
        # .Thread at BOOST_THREAD_VERSION 2 -- the version this tree selects by
        # default -- detaches a joinable thread on destruction and on move-assignment
        # instead of failing, where std::thread calls std::terminate. Code that grew
        # around the forgiving semantics is broken code; a second boost::thread
        # creeping in would put the silent thread leak back where the guards are not.
        #
        # Scope, stated per DOD 0 rule 9: tracked compiled code (*.cpp/*.hpp/*.h),
        # comments stripped -- the replacement code names boost::thread in order to
        # record what it replaced and what that version did, and prose that describes
        # a removal is not a use of it (the same rule the system() gate and counter 20
        # use). boost::date_time, boost::property_tree and Boost.Log are not in the
        # pattern: they are not threading primitives, and the logging core is a
        # separate item that is about to move.
        #
        # Verified to be capable of failing: re-adding `boost::mutex m;` to
        # modules/core/src/filterThread.cpp turns this step red on exactly one line;
        # removing it turns it green again.
        run: |
          set -uo pipefail
          hits=$(git ls-files -z '*.cpp' '*.hpp' '*.h' \
                   | xargs -0 -r grep -nHE 'boost::(thread|mutex|recursive_mutex|shared_mutex|condition_variable|unique_lock|lock_guard|shared_lock|thread_group|this_thread|barrier|once)|boost::bind|boost/thread|interprocess' \
                   | grep -vE ':[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::threading is std::thread/std::mutex/std::condition_variable here. Boost.Thread detaches a joinable thread where the standard terminates, and Boost.Interprocess is a cross-process primitive used inside one process. See cleanup/plan/structure.md P2-7 and cleanup/findings/correctness.md."
            exit 1
          fi
          echo 'no Boost threading primitives in the tracked sources'

name: CI

# Builds and runs the ctest suite. This is the gate the project never had:
# .github/ previously held only Codacy, Flawfinder and Dependabot, i.e. static
# analysis bots and a dependency updater, so nothing ever compiled or tested a
# change and "CI green" could not be cited as evidence (DOD 1.2).
#
# Triggers on pushes to any branch, not just main, because the cleanup work
# happens on feature branches and a gate that only runs after merge is not a
# gate. Concurrency cancels superseded runs so this stays cheap.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # Both configurations must be reported. With fail-fast the second cell
      # would be cancelled when the first fails, and the two fail for unrelated
      # reasons -- PCL-dependent code and PCL-independent code.
      fail-fast: false
      matrix:
        include:
          # The bta library is proprietary Becom SDK and cannot exist on a
          # runner, so every CI configuration is BTA-off. That axis is covered
          # here by construction; a BTA-on build can only be checked on a
          # developer machine that has the SDK.
          - label: "PCL on,  BTA off"
            without_pcl: "OFF"
          - label: "PCL off, BTA off"
            without_pcl: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          # libboost-all-dev rather than the individual component packages: the
          # build needs log, log_setup, program_options, system, filesystem,
          # date_time, serialization, chrono and thread, plus the header-only
          # container headers. The umbrella package is the reliable option; it
          # can be trimmed later if install time matters.
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            pkg-config \
            libboost-all-dev \
            libopencv-dev \
            libgtest-dev \
            libpcl-dev

      - name: Report toolchain
        run: |
          cmake --version | head -1
          g++ --version | head -1
          pkg-config --modversion opencv4 || true

      - name: Configure
        run: |
          set -euxo pipefail
          # No BUILD_DOC flag: it is referenced nowhere in the build and does
          # nothing. docs/CMakeLists.txt is include()'d unconditionally and its
          # target only ever runs on demand, so CI simply never builds it.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITHOUT_PCL=${{ matrix.without_pcl }}

      - name: Build
        # tee'd so the warning report step below can see what the compiler said.
        # pipefail is load-bearing: without it the exit status of the pipeline is
        # tee's and a failed build would sail through to the Test step.
        run: |
          set -eo pipefail
          cmake --build build -j "$(nproc)" 2>&1 | tee build.log

      - name: Warning report (P3-11)
        # Prints the warning count per area and fails only on modules/core, which
        # is compiled -Werror since P3-4. The rest of the tree is reported, not
        # gated - see tools/warning_report.sh for why.
        run: tools/warning_report.sh build.log

      - name: Test
        # --output-on-failure so a red run is diagnosable from the log alone,
        # without re-running anything.
        run: ctest --test-dir build --output-on-failure

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-${{ matrix.label }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
            build/Testing/Temporary/LastTest.log
            build.log
          if-no-files-found: ignore

  sanitizers:
    name: build & test (ASan + UBSan)
    runs-on: ubuntu-latest
    # A green ctest is weak evidence for a memory error; the sanitizers are the
    # stage gate DOD 2 puts on the threading and ownership work (P2-7, P2-5).
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libboost-all-dev libopencv-dev libgtest-dev libpcl-dev

      - name: Configure
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: ctest --test-dir build --output-on-failure

  installed-headers:
    name: installed headers compile standalone
    runs-on: ubuntu-latest
    # P3-12 / finding N1. `make install` ships every file under every */include/ directory,
    # and nothing in the build ever included most of them: a header whose only consumer was
    # deleted keeps shipping, keeps rotting, and stays invisible because the library still
    # builds. Four toffy/web/ headers got that far - one of them includes a file that does not
    # exist, so no user could ever have included it - and two in libraries/graphs/ compiled
    # only when some earlier include happened to pull OpenCV in first.
    #
    # The check compiles each installed header as the *only* include of a translation unit,
    # which is what a downstream user does. See tools/installed_header_check.sh for the
    # failure classification (a missing third-party header is a skip, a missing toffy header
    # is a finding) and for why a run that tests nothing exits 2.
    #
    # Scope, stated per DOD 0 rule 9: the *installed* tree, so it does not matter which of
    # the four install(DIRECTORY include/) rules put a header there. Two caveats: the runner
    # has no proprietary bta SDK, so modules/bta's tree is not installed and not tested here;
    # and a header whose third-party dependency is absent is reported as skipped rather than
    # as a pass.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            pkg-config \
            libboost-all-dev \
            libopencv-dev \
            libpcl-dev

      - name: Configure
        # Tests off: nothing under tests/ is installed, and Release because that is the
        # configuration the counters are quoted against.
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      - name: Build the library
        # install() ships libtoffy.so, so `cmake --install` fails without it; the apps and
        # the tests are not installed, so building only this target is the cheapest tree
        # that can be staged. The headers themselves are generated at configure time.
        run: cmake --build build -j "$(nproc)" --target toffy

      - name: Stage the install tree
        run: |
          set -euxo pipefail
          cmake --install build --prefix "$PWD/stage"
          echo "staged $(find stage/include \( -name '*.hpp' -o -name '*.h' \) | wc -l) headers"

      - name: Compile every installed header standalone and twice
        run: |
          set -euo pipefail
          # pkg-config rather than hardcoded paths: the PCL include directory carries its
          # version (/usr/include/pcl-1.14 today) and that is not ours to track.
          tools/installed_header_check.sh "$PWD/stage/include" \
            $(pkg-config --cflags opencv4 pcl_common)

      - name: No controller residue in the source tree
        # The compile check above can only reach what the runner can build, and the runner
        # has no proprietary bta SDK: modules/bta is never configured here, so its 7
        # installed headers are never staged and never compiled. Two of the four deleted
        # toffy/web/ headers lived in exactly that tree, and so did every WITH_CONTROL site
        # - this is the half of the gate the compile check is structurally blind to.
        #
        # Scope, stated per DOD 0 rule 9: code and build files only (*.cpp/*.hpp/*.h/*.in/
        # *CMakeLists.txt/*.cmake/*.dox). The cleanup docs discuss these strings in order to
        # record that they are gone, and tools/installed_header_check.sh names toffy_web/ in
        # its own classification comment; a gate that is always red is not a gate.
        #
        # Verified to be capable of failing: re-adding one #ifdef WITH_CONTROL line to
        # modules/bta/src/initPlugin.cpp turns this step red, removing it turns it green.
        run: |
          set -uo pipefail
          hits=$(git ls-files -z '*.cpp' '*.hpp' '*.h' '*.in' '*.txt' '*.cmake' '*.dox' \
                   | xargs -0 -r grep -nHE 'toffy_web/|toffy/web/|WITH_CONTROL' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '::error::the web control layer lives in toffy-oatpp, not here.' \
              'Do not reintroduce toffy/web/ headers or WITH_CONTROL hooks.' \
              'See cleanup/plan/controller-extraction.md.'
            exit 1
          fi
          echo 'no controller residue in the tracked code and build files'

  cmake-hygiene:
    name: cmake hygiene (if( ${VAR} ) sweep)
    runs-on: ubuntu-latest
    # P3-7 / finding N6. This bug class is what hid the PCL-less build for as long
    # as it took: if() takes variable *names*, so an empty variable makes
    #   if( ${V} )          silently false, and
    #   if( ${V} AND X )    a hard "Unknown arguments specified" configure error.
    # Both were measured on cmake 3.28 (see cleanup/findings/build.md).
    #
    # Scope, stated per DOD 0 rule 9: the 29 *tracked* CMakeLists.txt and *.cmake
    # files (git ls-files, so generated files in a build tree cannot produce a false
    # positive - toffyConfig.cmake in build/generated/ does contain if(${...}) and is
    # not ours to fix). MATCHES/STREQUAL comparisons are excluded because expanding
    # the left operand first is the idiom there and is correct as written.
    #
    # Verified to be capable of failing: re-introducing one site locally turns this
    # step red, and removing it turns it green again.
    steps:
      - uses: actions/checkout@v4

      - name: No if( ${VAR} ) sites
        run: |
          set -uo pipefail
          hits=$(git ls-files -z '*.cmake' '*CMakeLists.txt' \
                   | xargs -0 -r grep -HE '(if|elseif|while)[[:space:]]*\([[:space:]]*\$\{' \
                   | grep -vE 'MATCHES|STREQUAL' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '::error::if( ${VAR} ) expands before if() evaluates it. Write if(VAR).' \
              'See cleanup/plan/second-pass.md P3-7 and cleanup/findings/build.md N6.'
            exit 1
          fi
          echo 'no if( ${VAR} ) sites in the tracked CMake files'

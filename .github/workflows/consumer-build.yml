name: Consumer build

# P0-2 — build a consumer against this repository, from this commit.
#
# Why a second workflow instead of a job in ci.yml: it needs a dependency stack
# ci.yml has never needed (oatpp, oatpp-swagger) and a staging prefix, and the
# two fail for entirely unrelated reasons. Keeping it separate also means a
# consumer breakage cannot be confused with a toffy build breakage in the
# Actions list, which matters when the consumer side is the thing that is
# deliberately red (see the allowlist below).
#
# What this job is for. toffy's own CI compiles toffy against toffy's own
# headers, from the source tree. That has never once caught a consumer breakage:
# every error in the upgrade notes (the `FilterPtr` return, the version gate, the
# `${toffy__DEFINITIONS}` typo) was introduced in a toffy commit and surfaced
# three repositories away, weeks later. This is the edge that was missing.
#
# What it is NOT: a clone of toffy. The job lives in toffy, so toffy is the
# workspace — installing the workspace to a prefix and pointing the consumer at
# that tests *this commit*. Checking out a second copy of toffy would test some
# other commit and report it as this one, which is the exact shape of false
# green this job exists to avoid. (Until 2026-10-27 the note here said "clone
# with -b feature/code-cleanup", because origin/HEAD was the 1.6 line; P0-3
# closed that, and P1-11 with it.)
#
# Red/green semantics live in tools/consumer_build.sh and are worth reading
# before changing anything here:
#   * green  = the consumer built, linked, and uses no toffy symbol it did not
#     use before, OR it failed with exactly the errors recorded in
#     ci/consumer-expected-failures.txt and nothing else ("KNOWN BROKEN");
#   * red    = an error that is not on that list, or a build that passed while
#     its entries were still in the file, or new link coupling;
#   * rc 2   = the check could not run at all, which is red too — a gate that
#     fails open is worse than no gate because it gets cited as evidence.
#
# Toolchain: same contract as ci.yml, and the same measurement behind it. toffy
# ships on embedded systems with CMake 3 and nothing else, so every job here is
# `ubuntu-24.04` (a pinned image, not the moving one) and installs CMake 3.31.6
# via .github/actions/setup-cmake3. This workflow is the one place where a
# toolchain drift is most expensive: it stages toffy and hands the prefix to the
# consumer, so a CMake 4 configure here produces a staged tree the embedded
# build could never reproduce, and the consumer cell would then be measuring the
# wrong artifact while reporting green.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Stage toffy once. Four consumer cells would otherwise each rebuild the same
  # library, and this job's whole purpose is to be cheap enough that nobody is
  # tempted to turn it off.
  # --------------------------------------------------------------------------
  stage-toffy:
    name: stage toffy (this commit)
    runs-on: ubuntu-24.04  # pinned, not -latest — see the toolchain note in this file's header
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history with tags. This is the job whose install the consumers
          # are pointed at, and toffy's version comes from `git_describe`
          # (CMakeLists.txt:54): the default depth-1 checkout has no tags, so
          # describe fails, and the staged tree configures as
          # `version: -128-NOTFOUND` — which becomes the SONAME and the installed
          # toffyConfigVersion.cmake. The consumer then fails
          # `find_package(toffy 2.0)` with "not compatible" and the diagnosis
          # points at the consumer, not at the staging. Measured: a depth-1 clone
          # of this repository configures as `-128-NOTFOUND`; the CI cell on
          # c3c819a failed exactly that way. CMakeLists now also warns, so this
          # cannot degrade silently again.
          fetch-depth: 0

      # CMake 4 removed FindBoost (CMP0167); see .github/actions/setup-cmake3.
      - uses: ./.github/actions/setup-cmake3

      - name: Install dependencies
        # Deliberately the same list as ci.yml's build-test job. If the two
        # drift, the consumer job starts testing a toffy that no toffy job
        # builds — so keep them together by keeping them identical.
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            pkg-config \
            libboost-all-dev \
            libboost-system-dev libboost-filesystem-dev libboost-log-dev \
            libboost-program-options-dev libboost-date-time-dev \
            libboost-serialization-dev libboost-chrono-dev \
            libopencv-dev \
            libgtest-dev \
            libpcl-dev

      - name: Configure
        # Release, matching the recipe in the consumer upgrade notes
        # (UPGRADE_PROGRESS.md §Reproducing this). The consumers are then built
        # in both configurations against this one install — see the matrix.
        #
        # Two steps, not one, and both self-reporting. The first version of this
        # job combined them and could not say which half failed: a failed step on
        # GitHub annotates as "Process completed with exit code 1" and nothing
        # else, and the log behind it needs a logged-in browser. A red nobody can
        # diagnose is a red people learn to ignore, so the tail of the output goes
        # out as annotations — for CMake, the last lines are where it states what
        # it could not find.
        # could not say which half failed — the annotations showed only the
        # generic "exit code 1", because the branch that emits them was around
        # the configure and the failure was somewhere else. Diagnosing a red run
        # should not require a logged-in browser: the log behind these annotations
        # is exactly that, and it is also an artifact.
        # The `|| rc=${PIPESTATUS[0]}` shape is not stylistic. Actions runs each
        # step under `bash -e`, so a failing pipeline ends the step on its own
        # line — and the second version of this step died exactly there, printing
        # none of the annotations it was written to print, leaving the generic
        # "exit code 1" again. `cmd | tee log || rc=...` keeps -e from firing and
        # still captures the real status. Verified locally under `bash -e -o
        # pipefail` before pushing, which is the rule this repository already has
        # for checks: prove the check can fail, then prove it reports.
        run: |
          set -uo pipefail
          rc=0
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /tmp/toffy-configure.log \
            || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            printf '::error::toffy CONFIGURE failed (rc %s)\n' "$rc"
            # The error, not the tail. GitHub keeps ~10 annotations per check
            # run, and a 30-line tail spends them on the noise around the failure
            # — the second round of this read "CMP0167 …" nine times and never
            # showed the CMake Error, because the error is *after* the warning and
            # the cap kept the earlier lines. Grep for the error and its context.
            grep -E 'CMake Error' -A 10 /tmp/toffy-configure.log | head -25 \
              | sed 's/^/::error::/'
            grep -E 'Could not find|By not providing|CMake Error' /tmp/toffy-configure.log \
              | head -6 | sed 's/^/::error::/'
            exit "$rc"
          fi
          grep -E 'version:|PCL_|HAS_BTA|CXX_STANDARD|OpenNI|VTK' /tmp/toffy-configure.log \
            | head -10 || true

      - name: Build
        run: |
          set -uo pipefail
          rc=0
          cmake --build build -j "$(nproc)" 2>&1 | tee /tmp/toffy-build.log \
            || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            printf '::error::toffy BUILD failed (rc %s) — first error lines below\n' "$rc"
            grep -m 15 -E 'error:|Error [0-9]' /tmp/toffy-build.log | sed 's/^/::error::/'
            tail -n 15 /tmp/toffy-build.log | sed 's/^/::error::/'
            exit "$rc"
          fi

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: toffy-stage-logs
          path: /tmp/toffy-*.log
          if-no-files-found: ignore

      - name: Install to a staging prefix
        run: |
          set -euxo pipefail
          cmake --install build --prefix "$RUNNER_TEMP/stage"
          # Fail here, not four cells later, if the prefix is not what a
          # consumer needs. tools/consumer_build.sh checks too; this check is
          # cheaper and names the real problem.
          test -d "$RUNNER_TEMP/stage/lib/cmake/toffy"
          ls "$RUNNER_TEMP/stage"/lib/libtoffy.so.*

      - uses: actions/upload-artifact@v4
        with:
          name: toffy-stage
          path: ${{ runner.temp }}/stage
          retention-days: 3
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # The consumers. One ref now, and that is the success condition arriving.
  #
  # This matrix used to have two: `feature/toffy-upgrade`, the line that was
  # supposed to work, and `main`, the un-upgraded line, recorded as an expected
  # failure so that "toffy-oatpp main is still on 1.6" could not be lost track
  # of. The allowlist said the day Phase 1 merged, the `main` cell would go red
  # demanding its entries be deleted, and that red was the point.
  #
  # Phase 1 merged on 2026-10-30: `feature/toffy-upgrade` fast-forwarded onto
  # `main` and `v0.1.0` was cut there (P1-4). Two cells testing one line is not
  # coverage, it is noise, so the branch cell is gone and the `main` entry in
  # ci/consumer-expected-failures.txt is deleted — the shrinking of the list is
  # the progress this job exists to show. If a future toffy commit breaks the
  # consumer, the correct response is a red cell and a fix, not a new allowlist
  # entry: entries are for known-broken consumers with a named owner and a
  # deleting condition, not for surprises.
  #
  # Both configurations stay, per the phase notes: the consumers add
  # -Wall -ggdb -O0 unconditionally and -O2 again in Release, so Debug is the
  # configuration where the compiler still has something to say.
  # --------------------------------------------------------------------------
  toffy-oatpp:
    name: toffy-oatpp (${{ matrix.ref }}, ${{ matrix.build_type }})
    needs: stage-toffy
    runs-on: ubuntu-24.04  # pinned, not -latest — see the toolchain note in this file's header
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        ref: [main]
    steps:
      - uses: actions/checkout@v4
        # Only for tools/ and ci/ — the toffy *code* comes from the artifact.

      # toffy-oatpp calls find_package(Boost …) too, so the consumer needs the
      # same floor as the library it is consuming.
      - uses: ./.github/actions/setup-cmake3

      - uses: actions/download-artifact@v4
        with:
          name: toffy-stage
          path: ${{ runner.temp }}/stage

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config git \
            libboost-all-dev libboost-system-dev libboost-filesystem-dev libboost-log-dev libboost-program-options-dev libboost-date-time-dev libboost-serialization-dev libboost-chrono-dev libopencv-dev libgtest-dev libpcl-dev \
            libeigen3-dev libflann-dev libusb-1.0-0-dev libopenni2-dev

      - name: Install oatpp and oatpp-swagger
        # Pinned — by commit, because there is no tag to pin to, and that is not
        # a style choice. The first version of this step said `--branch 1.4.0`
        # and died in under a second in all four cells (run 40960528367, all of
        # 2026-10-29): no consumer cell ever ran, and the run said only
        # "Process completed with exit code 1".
        #
        # Measured 2026-10-30: the newest tag upstream is `1.3.1` in both
        # repositories (api.github.com/repos/oatpp/oatpp/tags → 19 tags, newest
        # numeric 1.3.1; oatpp-swagger the same). The `1.4.0` that
        # toffy-oatpp's `find_package(oatpp 1.4.0 REQUIRED)` asks for exists
        # only as `master`, where it is a string in a header
        # (`src/oatpp/Environment.hpp`: `#define OATPP_VERSION "1.4.0"`) and a
        # line in CMakeLists (`OATPP_THIS_MODULE_VERSION "1.4.0"`). So: pin the
        # SHA, and assert the version string rather than trusting the pin — if
        # upstream tags 1.4.0 properly one day, or moves master, this step says
        # so in one line instead of the consumer drifting onto a different oatpp.
        # Both SHAs below are the master tips that the local oatpp 1.4.0 install
        # — the one every measurement in the upgrade notes was taken against —
        # was built from, and the fetch-by-SHA + both asserts are verified
        # locally, as is the build and install of both packages.
        #
        # The `cmake --build` is the second bug in the same step: it configured
        # and then installed, which fails copying a library that was never
        # compiled. Invisible until now, because the clone killed the step first
        # — the reason a step that fails early hides every bug after it, and why
        # "the job is red" is not a diagnosis.
        #
        # toffy-oatpp's dropped `next` line (P1-12, 2026-10-28) also asked for
        # find_package(oatpp-websocket 1.4.0 REQUIRED) and find_package(oatpp-socketio).
        # Neither is needed by `main`, so neither is installed today. If that line
        # is ever revived from its archive tag, install both here first, in the
        # same pinned-and-asserted style — otherwise the new cell goes red on a
        # missing dependency and the job becomes the thing it exists to prevent.
        # Measured against origin/next@3a97d1b (archived as
        # `archive/next-2025-04-25`, recoverable from the bundle).
        run: |
          set -euxo pipefail
          OATPP_SHA=f83d648fd82dc222ef88aabbafb68efbd7d7bf50
          OATPP_SWAGGER_SHA=8cb460b546e84b06939a12897c85a6d863c1c53e
          fetch_pinned() {   # url sha dir — GitHub serves arbitrary SHAs, and
            git init -q "$3" # here a tag is not available to fetch by
            git -C "$3" fetch -q --depth 1 "$1" "$2"
            git -C "$3" checkout -q FETCH_HEAD
          }
          fetch_pinned https://github.com/oatpp/oatpp.git "$OATPP_SHA" /tmp/oatpp
          grep -q '#define OATPP_VERSION "1.4.0"' /tmp/oatpp/src/oatpp/Environment.hpp
          cmake -S /tmp/oatpp -B /tmp/oatpp/build -DCMAKE_BUILD_TYPE=Release \
            -DOATPP_BUILD_TESTS=OFF
          cmake --build /tmp/oatpp/build -j "$(nproc)"
          sudo cmake --install /tmp/oatpp/build
          fetch_pinned https://github.com/oatpp/oatpp-swagger.git "$OATPP_SWAGGER_SHA" /tmp/oatpp-swagger
          grep -q 'set(OATPP_THIS_MODULE_VERSION "1.4.0")' /tmp/oatpp-swagger/CMakeLists.txt
          cmake -S /tmp/oatpp-swagger -B /tmp/oatpp-swagger/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/oatpp-swagger/build -j "$(nproc)"
          sudo cmake --install /tmp/oatpp-swagger/build

      - name: Consumer build
        # Anonymous HTTPS, always. The token is optional and only layers
        # credentials onto that same URL: set CONSUMER_TOKEN (a fine-grained PAT
        # with read-only access to that one repository) if toffy-oatpp ever goes
        # private. What this step used to do was fall back to the **SSH** URL on
        # the grounds that "toffy-oatpp is readable anonymously" — and that is
        # true (measured 2026-10-30: the API reports `private: false`, and
        # `git ls-remote https://github.com/voxel-dot-at/toffy-oatpp.git` works
        # with no credentials at all). But SSH is not anonymous: a hosted runner
        # has no key for someone else's repository, so both cells died with
        # "Could not read from remote repository" and rc 2 — the third bug in
        # this job, and the second time the same sentence ("readable
        # anonymously", "1.4.0 is a tag") was load-bearing and untested. The
        # only thing that worked correctly here is the script's rc 2: it refused
        # to call "could not run" a pass.
        env:
          CONSUMER_TOKEN: ${{ secrets.CONSUMER_TOKEN }}
        run: |
          set -euxo pipefail
          if [ -n "${CONSUMER_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${CONSUMER_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          REPO="https://github.com/voxel-dot-at/toffy-oatpp.git"
          rc=0
          tools/consumer_build.sh \
            --toffy-prefix "$RUNNER_TEMP/stage" \
            --repo "$REPO" \
            --ref "${{ matrix.ref }}" \
            --build-type "${{ matrix.build_type }}" \
            --allowlist ci/consumer-expected-failures.txt \
            --link-surface ci/consumer-link-surface.txt 2>&1 | tee /tmp/consumer.log \
            || rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # The script's own verdict lines are the diagnosis; lift them into the
            # annotations so the run page says *which* case it is — new breakage,
            # stale allowlist, or new coupling — without opening the log.
            printf '::error::consumer check failed (rc %s) for %s\n' "$rc" "${{ matrix.ref }}"
            # Lift the *verdict block*, not just its first line. The script prints
            # the offending errors as bullets under the verdict, and the first
            # version of this grep matched only the heading — so run 41105063856
            # said "1 error(s) NOT on the allowlist" and never said which, which
            # is precisely the red-nobody-can-read this file has already been
            # rewritten twice over. -A 8 carries the bullets into the annotations.
            grep -E -A 8 'NOT on the allowlist|the build is GREEN, and the allowlist|new toffy coupling|could not|Could not' \
              /tmp/consumer.log | head -14 | sed 's/^[[:space:]]*/::error::/'
            exit "$rc"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-logs-toffy-oatpp-${{ matrix.ref }}-${{ matrix.build_type }}
          path: /tmp/consumer-build-*
          if-no-files-found: ignore
